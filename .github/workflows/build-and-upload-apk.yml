name: Build & Publish Android APK Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.4"
        required: true
        type: string
      notes:
        description: "Release notes"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Verify app
        run: |
          npm run typecheck
          npm run test:app-logic
          npm run test:category-flow
          npm run test:update-logic
          npm run test:update-network
          npm run test:overlay-theme

      - name: Resolve release metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$RELEASE_VERSION"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))" >> "$GITHUB_ENV"
          echo "APK_NAME=memeplan-$VERSION.apk" >> "$GITHUB_ENV"

      - name: Patch app.json version
        run: |
          node -e 'const fs=require("fs"); const p="app.json"; const c=JSON.parse(fs.readFileSync(p)); c.expo.version=process.env.VERSION; c.expo.android={...(c.expo.android||{}),versionCode:Number(process.env.VERSION_CODE)}; fs.writeFileSync(p,JSON.stringify(c,null,2)+"\n")'

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/debug.keystore
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Collect APK
        run: cp "$(find android/app/build/outputs/apk -name app-release.apk -type f | head -n 1)" "$APK_NAME"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          if [ -n "$RELEASE_NOTES" ]; then
            printf '%s\n' "$RELEASE_NOTES" > release-notes.md
          elif [ -f "docs/releases/$VERSION.md" ]; then
            cp "docs/releases/$VERSION.md" release-notes.md
          else
            printf 'MemePlan %s\n' "$VERSION" > release-notes.md
          fi
          node scripts/create-update-manifest.cjs "$VERSION" "$APK_NAME" release-notes.md > update.json
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "$APK_NAME" update.json --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --title "MemePlan v$VERSION" --notes-file release-notes.md
          else
            gh release create "v$VERSION" "$APK_NAME" update.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "MemePlan v$VERSION" --notes-file release-notes.md
          fi
