# Build an Android APK directly on the GitHub runner (no EAS, no Cloudflare R2)
# and publish it as a GitHub Release. No external Secrets are required — the
# release is created with the automatically-provided GITHUB_TOKEN.
#
# Triggers:
#   - manual: Actions tab -> "Run workflow"
#   - tag:    git tag v1.0.2 && git push origin v1.0.2
#
# The built APK is signed with the debug keystore (Expo prebuild's default for
# the release build type when no keystore is configured), so it installs on
# devices that allow unknown sources without extra signing secrets.

name: Build & Publish Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: apk-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build APK and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Resolve version from tag
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # Strip leading "v" so v1.0.2 -> 1.0.2
          VERSION="${TAG#v}"
          # Deterministic versionCode from the tag (major*10^6 + minor*10^3 + patch)
          IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION}"
          VERSION_CODE=$(( MAJOR * 1000000 + MINOR * 1000 + PATCH ))
          echo "TAG=${TAG}"
          echo "VERSION=${VERSION}"
          echo "VERSION_CODE=${VERSION_CODE}"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "VERSION_CODE=${VERSION_CODE}" >> "${GITHUB_ENV}"
          echo "APK_NAME=memeplan-${VERSION}.apk" >> "${GITHUB_ENV}"

      - name: Patch app.json to the tagged version
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const path = 'app.json';
          const cfg = JSON.parse(fs.readFileSync(path, 'utf8'));
          const version = process.env.VERSION;
          const versionCode = Number(process.env.VERSION_CODE);
          cfg.expo.version = version;
          cfg.expo.android = cfg.expo.android || {};
          cfg.expo.android.versionCode = versionCode;
          fs.writeFileSync(path, JSON.stringify(cfg, null, 2) + '\n');
          console.log('patched app.json version=' + cfg.expo.version + ' versionCode=' + cfg.expo.android.versionCode);
          NODE
        env:
          VERSION: ${{ env.VERSION }}
          VERSION_CODE: ${{ env.VERSION_CODE }}

      - name: Generate native project (Expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK with Gradle
        run: |
          set -euo pipefail
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
          echo "--- APK outputs ---"
          find app/build/outputs/apk -name "*.apk" -type f

      - name: Collect APK and compute SHA-256
        run: |
          set -euo pipefail
          mkdir -p dist
          APK_SRC="$(find android/app/build/outputs/apk -name "app-release.apk" -type f | head -n 1)"
          test -n "${APK_SRC}" || { echo "::error::app-release.apk not found"; exit 1; }
          cp "${APK_SRC}" "dist/${APK_NAME}"
          SHA256="$(sha256sum "dist/${APK_NAME}" | awk '{print $1}')"
          echo "APK_SRC=${APK_SRC}"
          echo "SHA256=${SHA256}" >> "${GITHUB_ENV}"
          echo "Resolved APK=${APK_NAME} SHA256=${SHA256}"

      - name: Verify APK
        run: |
          set -euo pipefail
          test -f "dist/${APK_NAME}"
          file "dist/${APK_NAME}"
          ls -lh "dist/${APK_NAME}"

      - name: Create GitHub Release
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # Standard SHA256SUMS format: "<hash>  <filename>"
          printf '%s  %s\n' "${SHA256}" "${APK_NAME}" > "dist/${APK_NAME}.sha256"

          # Changelog: commits since the previous release tag (or all history).
          PREV_RELEASE_TAG="$(
            gh release list --repo "${GITHUB_REPOSITORY}" --limit 50 \
              | awk -v ctag="${TAG}" '$1 != ctag { print $1; exit }'
          )"
          if [ -n "${PREV_RELEASE_TAG}" ]; then
            LOG_RANGE="${PREV_RELEASE_TAG}..HEAD"
          else
            LOG_RANGE="HEAD"
          fi
          CHANGELOG="$(
            git log --no-merges --pretty=format:'- %s' "${LOG_RANGE}" 2>/dev/null || true
          )"
          if [ -z "${CHANGELOG}" ]; then
            CHANGELOG="首次发布（无更新日志条目）"
          fi

          {
            echo "Android APK ${VERSION} (versionCode ${VERSION_CODE})"
            echo ""
            echo "SHA-256:"
            echo '```'
            echo "${SHA256}  ${APK_NAME}"
            echo '```'
            echo ""
            echo "APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK_NAME}"
            echo ""
            echo "## 更新日志"
            echo "${CHANGELOG}"
          } > dist/release-notes.md

          gh release create "${TAG}" \
            "dist/${APK_NAME}" "dist/${APK_NAME}.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "MemePlan v${VERSION}" \
            --notes-file dist/release-notes.md \
            || { echo "::error::gh release create failed (release ${TAG} may already exist)"; exit 1; }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write Actions summary
        run: |
          set -euo pipefail
          {
            echo "## Android APK Build"
            echo ""
            echo "**Version:** ${VERSION}"
            echo ""
            echo "**Version Code:** ${VERSION_CODE}"
            echo ""
            echo "**SHA-256:** ${SHA256}"
            echo ""
            echo "**APK URL:** https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${APK_NAME}"
          } >> "${GITHUB_STEP_SUMMARY}"
