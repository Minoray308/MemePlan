name: Build & Publish Android APK Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.3"
        required: true
        type: string
      notes:
        description: "Release notes"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Resolve release metadata
        run: |
          VERSION="${{ inputs.version }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))" >> "$GITHUB_ENV"
          echo "APK_NAME=memeplan-$VERSION.apk" >> "$GITHUB_ENV"

      - name: Patch app.json version
        run: |
          node -e 'const fs=require("fs"); const p="app.json"; const c=JSON.parse(fs.readFileSync(p)); c.expo.version=process.env.VERSION; c.expo.android={...(c.expo.android||{}),versionCode:Number(process.env.VERSION_CODE)}; fs.writeFileSync(p,JSON.stringify(c,null,2)+"\n")'

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: cp "$(find android/app/build/outputs/apk -name app-release.apk -type f | head -n 1)" "dist-$APK_NAME"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "dist-$APK_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "MemePlan v$VERSION" \
            --notes "${{ inputs.notes || format('MemePlan {0}', inputs.version) }}"
